name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version (3.14); --locked fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      # Tests use small synthetic fixtures and a mock Jev API: no dataset, no TYPESAFE_API_KEY.
      - name: Run tests
        run: uv run pytest -q
